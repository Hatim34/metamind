spring.application.name=metamind-backend
spring.datasource.url=${METAMIND_DATABASE_URL:jdbc:h2:mem:metamind;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${METAMIND_DATABASE_USERNAME:sa}
spring.datasource.password=${METAMIND_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${METAMIND_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${METAMIND_H2_CONSOLE:true}
metamind.jwt.secret=${METAMIND_JWT_SECRET:change-this-development-secret-for-production}
metamind.jwt.duration-seconds=${METAMIND_JWT_DURATION_SECONDS:3600}
metamind.public-url=${METAMIND_PUBLIC_URL:https://metamind-app.duckdns.org}
metamind.llm.provider=${METAMIND_LLM_PROVIDER:local}
metamind.gemini.api-key=${GEMINI_API_KEY:}
metamind.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
