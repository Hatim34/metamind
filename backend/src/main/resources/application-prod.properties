metamind.seed-data=false
metamind.seed-reset=false
metamind.h2.console.enabled=false
# baseline-on-migrate est indispensable, et il ne fait pas sauter V1.
# Verifie par essai sur PostgreSQL 16 :
#  - base VIDE : Flyway ecrit "All configured schemas are empty; a baseline marker will
#    not be added" puis applique V1, V2, ... jusqu'a la derniere. Rien n'est saute.
#  - base NON VIDE sans historique (cas de la base Render creee par ddl-auto=update) :
#    sans ce reglage Flyway refuse de demarrer avec "Found non-empty schema(s) but no
#    schema history table", et l'application ne demarre pas du tout.
# baseline-version=2 laisse donc V3 et suivantes rattraper une base historique,
# tout en construisant tout le schema sur une base neuve.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.jpa.hibernate.ddl-auto=validate
