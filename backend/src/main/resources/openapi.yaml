openapi: 3.0.3

info:
  title: Metamind API
  version: 1.0.0
  description: >
    API REST de Metamind, plateforme de depot institutionnel avec extraction
    automatique de metadonnees par intelligence artificielle (Google Gemini).
    Les bibliothecaires importent des publications, l'IA propose des metadonnees,
    le bibliothecaire valide, les chercheurs consultent un catalogue public.
    Authentification par jeton JWT. Roles : LIBRARIAN, ADMIN.
    Ce document OpenAPI sert de source a l'interface Swagger UI.
  contact:
    name: ASSAL Hatim - TFE Bachelier Informatique, ICC 2025-2026
  license:
    name: Usage academique (TFE)

servers:
  - url: https://metamind-app.duckdns.org/api/v1
    description: Serveur de production (prevu, HTTPS via certificat Let's Encrypt)

tags:
  - name: Auth
    description: Inscription, connexion, gestion du jeton
  - name: Documents
    description: Import et gestion des documents
  - name: Extraction
    description: Lancement de l'extraction des metadonnees par IA
  - name: Metadonnees
    description: Consultation et validation des metadonnees
  - name: Recherche
    description: Recherche publique et Open Data
  - name: Credits
    description: Solde, achat de packs de credits (Stripe)
  - name: Statistiques
    description: Indicateurs d'usage
  - name: Administration
    description: Gestion des utilisateurs, institutions, configuration (ADMIN)

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Inscrire un bibliothecaire
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, mot_de_passe, nom, prenom, institution_id]
              properties:
                email: { type: string, format: email, example: sarah@institution-a.example }
                mot_de_passe: { type: string, format: password, minLength: 8 }
                nom: { type: string, example: Mertens }
                prenom: { type: string, example: Sarah }
                institution_id: { type: integer, example: 1 }
      responses:
        '201': { description: Compte cree (statut EN_ATTENTE, a valider par un admin) }
        '409': { description: Email deja utilise, $ref: '#/components/responses/Error' }
        '422': { description: Donnees invalides, $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir un jeton JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, mot_de_passe]
              properties:
                email: { type: string, format: email, example: sarah@institution-a.example }
                mot_de_passe: { type: string, format: password }
      responses:
        '200':
          description: Connexion reussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Jeton JWT (Bearer) }
                  expires_in: { type: integer, example: 3600 }
                  utilisateur: { $ref: '#/components/schemas/User' }
        '401': { description: Identifiants invalides, $ref: '#/components/responses/Error' }

  /documents:
    get:
      tags: [Documents]
      summary: Lister les documents de son institution
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/q'
        - name: statut
          in: query
          schema: { type: string, enum: [EN_ATTENTE, EXTRACTION, A_VALIDER, PUBLIE, SUPPRIME] }
      responses:
        '200':
          description: Page de documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      contenu:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Documents]
      summary: Importer un document (fichier PDF/DOCX/TXT)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fichier]
              properties:
                fichier: { type: string, format: binary }
                visibilite: { type: string, enum: [PUBLIC, INSTITUTION], default: INSTITUTION }
      responses:
        '201':
          description: Document cree (statut EN_ATTENTE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '413': { description: Fichier trop volumineux, $ref: '#/components/responses/Error' }

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Consulter un document
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Documents]
      summary: Supprimer un document (suppression logique, statut SUPPRIME)
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: Document supprime (statut SUPPRIME, ligne conservee) }
        '404': { $ref: '#/components/responses/Error' }

  /documents/{id}/extraction:
    post:
      tags: [Extraction]
      summary: Lancer l'extraction des metadonnees par IA (consomme 1 credit)
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '202':
          description: Extraction lancee (traitement asynchrone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichissement_id: { type: integer }
                  statut: { type: string, enum: [EN_FILE, EN_COURS, TERMINE, ECHEC], example: EN_FILE }
        '402': { description: Solde de credits insuffisant, $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /documents/{id}/metadata:
    get:
      tags: [Metadonnees]
      summary: Consulter les metadonnees (et les suggestions de l'IA)
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200':
          description: Metadonnees du document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metadata' }
    put:
      tags: [Metadonnees]
      summary: Valider ou corriger les metadonnees
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Metadata' }
      responses:
        '200': { description: Metadonnees validees (statut VALIDE), $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /search:
    get:
      tags: [Recherche]
      summary: Recherche plein texte dans le catalogue public
      security: []
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: langue
          in: query
          schema: { type: string, example: fr }
        - name: type
          in: query
          schema: { type: string, example: article }
      responses:
        '200':
          description: Resultats publics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      contenu:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
            application/rss+xml:
              schema: { type: string, description: Flux RSS des dernieres publications }

  /credits:
    get:
      tags: [Credits]
      summary: Consulter le solde de credits de son institution
      responses:
        '200':
          description: Solde courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditBalance' }

  /credits/packs:
    get:
      tags: [Credits]
      summary: Lister les packs de credits disponibles
      security: []
      responses:
        '200':
          description: Catalogue des packs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackCredits' }
    post:
      tags: [Credits]
      summary: Acheter un pack de credits (redirige vers Stripe Checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack_id, cgv_acceptees]
              properties:
                pack_id: { type: integer, example: 2 }
                cgv_acceptees: { type: boolean, example: true, description: Acceptation des CGV et renonciation au droit de retractation }
      responses:
        '200':
          description: Session de paiement creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url: { type: string, example: https://checkout.stripe.com/c/pay/... }
                  reference: { type: string, example: cs_a1b2c3d4e5f6a7b8c9d0e1f2 }
        '400': { description: CGV non acceptees, $ref: '#/components/responses/Error' }

  /webhooks/stripe:
    post:
      tags: [Credits]
      summary: Reception des evenements Stripe (paiement confirme)
      security: []
      description: Point d'entree appele par Stripe. Signature verifiee (en-tete Stripe-Signature).
      responses:
        '200': { description: Evenement traite }
        '400': { description: Signature invalide, $ref: '#/components/responses/Error' }

  /stats:
    get:
      tags: [Statistiques]
      summary: Indicateurs d'usage (taux d'acceptation des suggestions, etc.)
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents_publies: { type: integer, example: 55 }
                  taux_acceptation_suggestions: { type: number, format: float, example: 0.78 }
                  extractions_totales: { type: integer, example: 144 }

  /admin/users:
    get:
      tags: [Administration]
      summary: Lister tous les utilisateurs (ADMIN)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: institutionId
          in: query
          description: Filtrer par institution (ADMIN uniquement)
          schema: { type: integer }
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      contenu:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/users/{id}:
    patch:
      tags: [Administration]
      summary: Activer, desactiver ou changer le role d'un utilisateur (ADMIN)
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statut: { type: string, enum: [EN_ATTENTE, ACTIF, DESACTIVE] }
                role: { type: string, enum: [LIBRARIAN, ADMIN] }
      responses:
        '200': { description: Utilisateur mis a jour }
        '403': { $ref: '#/components/responses/Error' }

  /admin/institutions:
    get:
      tags: [Administration]
      summary: Lister les institutions (ADMIN)
      responses:
        '200':
          description: Liste des institutions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Institution' }

  /admin/config:
    get:
      tags: [Administration]
      summary: Lire la configuration de la plateforme (ADMIN)
      responses:
        '200':
          description: Cles de configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
                example:
                  modele_llm: gemini-2.5-flash
                  taille_max_upload_mo: "128"
                  prix_credit_eur: "0.50"

  /admin/logs:
    get:
      tags: [Administration]
      summary: Consulter le journal d'audit (ADMIN)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Page de journaux
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      contenu:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            action: { type: string, example: EXTRACTION }
                            type_entite: { type: string, example: document }
                            date_creation: { type: string, format: date-time }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton JWT obtenu via /auth/login, envoye dans l'en-tete Authorization.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    page:
      name: page
      in: query
      description: Numero de page (0 pour la premiere)
      schema: { type: integer, default: 0, minimum: 0 }
    size:
      name: size
      in: query
      description: Nombre d'elements par page
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    sort:
      name: sort
      in: query
      description: Champ de tri, suffixe par ,asc ou ,desc
      schema: { type: string, example: "date_creation,desc" }
    q:
      name: q
      in: query
      description: Terme de recherche plein texte
      schema: { type: string, example: intelligence artificielle }

  responses:
    Error:
      description: Reponse d'erreur normalisee
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    Document:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nom_fichier: { type: string, example: doc_0001.pdf }
        statut: { type: string, enum: [EN_ATTENTE, EXTRACTION, A_VALIDER, PUBLIE, SUPPRIME], example: PUBLIE }
        visibilite: { type: string, enum: [PUBLIC, INSTITUTION], example: PUBLIC }
        institution_id: { type: integer, example: 1 }
        date_creation: { type: string, format: date-time }

    Metadata:
      type: object
      properties:
        id: { type: integer }
        document_id: { type: integer, example: 1 }
        titre: { type: string, example: Etude de la corrosion des aciers inoxydables }
        resume: { type: string }
        date_publication: { type: string, format: date, example: "2023-05-12" }
        classification: { type: string, example: Chimie }
        langue: { type: string, example: fr }
        type_document: { type: string, example: article }
        statut: { type: string, enum: [EN_ATTENTE, VALIDE, REJETE], example: VALIDE }
        auteurs:
          type: array
          items:
            type: object
            properties:
              nom_complet: { type: string, example: Sarah Mertens }
              orcid: { type: string, example: "0000-0002-1825-0097" }
        mots_cles:
          type: array
          items: { type: string, example: electrochimie }

    User:
      type: object
      properties:
        id: { type: integer, example: 4 }
        email: { type: string, format: email, example: sarah@institution-a.example }
        nom: { type: string, example: Mertens }
        prenom: { type: string, example: Sarah }
        role: { type: string, enum: [LIBRARIAN, ADMIN], example: LIBRARIAN }
        statut: { type: string, enum: [EN_ATTENTE, ACTIF, DESACTIVE], example: ACTIF }
        institution_id: { type: integer, example: 1 }

    Institution:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nom: { type: string, example: Institution A }
        domaine_email: { type: string, example: institution-a.example }
        solde_credits: { type: integer, example: 320 }

    CreditBalance:
      type: object
      properties:
        institution_id: { type: integer, example: 1 }
        solde_credits: { type: integer, example: 320 }

    PackCredits:
      type: object
      properties:
        id: { type: integer, example: 2 }
        quantite: { type: integer, example: 500 }
        montant_paye: { type: number, format: float, example: 200.00 }
        statut: { type: string, enum: [EN_ATTENTE, PAYE, ECHEC], example: PAYE }

    Page:
      type: object
      description: Enveloppe de pagination commune aux listes
      properties:
        contenu: { type: array, items: {} }
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        total_elements: { type: integer, example: 100 }
        total_pages: { type: integer, example: 5 }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 404 }
        erreur: { type: string, example: Not Found }
        message: { type: string, example: Document introuvable }
        chemin: { type: string, example: /api/v1/documents/9999 }
