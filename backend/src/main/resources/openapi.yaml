openapi: 3.0.3
info:
  title: Metamind API
  version: 0.2.0
  description: API REST de Metamind pour la gestion de publications institutionnelles, de comptes utilisateurs, de credits et d'extraction de metadonnees.
servers:
  - url: https://metamind-app.duckdns.org/api/v1
    description: Serveur de production prevu
  - url: http://localhost:8080/api/v1
    description: Serveur local
tags:
  - name: Health
  - name: Documentation
  - name: Auth
  - name: Publications
  - name: Open Data
  - name: Institutions
  - name: Users
  - name: Credits
  - name: Extraction
  - name: Statistics
paths:
  /health:
    get:
      tags: [Health]
      summary: Verifier l'etat de l'API
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /openapi.yaml:
    get:
      tags: [Documentation]
      summary: Consulter le contrat OpenAPI
      responses:
        "200":
          description: Contrat OpenAPI au format YAML
          content:
            application/yaml:
              schema:
                type: string
  /auth/login:
    post:
      tags: [Auth]
      summary: Connecter un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Connexion reussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Identifiants invalides
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscrire un bibliothecaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Inscription reussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /publications:
    get:
      tags: [Publications]
      summary: Lister les publications du catalogue
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Liste des publications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publication"
    post:
      tags: [Publications]
      summary: Creer une publication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationRequest"
      responses:
        "201":
          description: Publication creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
  /publications/{id}:
    get:
      tags: [Publications]
      summary: Consulter une publication
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Publication trouvee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "404":
          description: Publication introuvable
  /publications/{id}/status:
    put:
      tags: [Publications]
      summary: Modifier le statut d'une publication
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationStatusRequest"
      responses:
        "200":
          description: Statut modifie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          description: Statut invalide pour une modification manuelle
        "403":
          description: Publication rattachee a une autre institution
  /publications/{publicationId}/extraction:
    post:
      tags: [Extraction]
      summary: Lancer une extraction de metadonnees
      security:
        - bearerAuth: []
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Metadonnees suggerees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataExtraction"
        "402":
          description: Solde de credits insuffisant
  /open-data/rss:
    get:
      tags: [Open Data]
      summary: Exposer les publications publiques au format RSS
      responses:
        "200":
          description: Flux RSS public
          content:
            application/rss+xml:
              schema:
                type: string
                example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><rss version=\"2.0\"><channel></channel></rss>"
  /open-data/publications/{id}/dublin-core:
    get:
      tags: [Open Data]
      summary: Exporter une publication publique au format Dublin Core
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Metadonnees Dublin Core
          content:
            application/xml:
              schema:
                type: string
                example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><metadata xmlns:dc=\"http://purl.org/dc/elements/1.1/\"></metadata>"
        "404":
          description: Publication publique introuvable
  /institutions:
    get:
      tags: [Institutions]
      summary: Lister les institutions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des institutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institution"
    post:
      tags: [Institutions]
      summary: Creer une institution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstitutionRequest"
      responses:
        "201":
          description: Institution creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
  /institutions/{id}:
    delete:
      tags: [Institutions]
      summary: Desactiver une institution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Institution desactivee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
  /users/{id}/profile:
    get:
      tags: [Users]
      summary: Consulter son profil
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [Users]
      summary: Modifier son profil
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profil modifie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    delete:
      tags: [Users]
      summary: Demander la suppression logique du compte
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Compte desactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/credits:
    get:
      tags: [Credits]
      summary: Consulter le solde de credits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Solde de credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
  /users/{userId}/credits/movements:
    get:
      tags: [Credits]
      summary: Consulter l'historique des credits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Historique des mouvements de credits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditMovement"
  /users/{userId}/credits/purchase:
    post:
      tags: [Credits]
      summary: Acheter des credits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseRequest"
      responses:
        "200":
          description: Solde mis a jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
  /statistics:
    get:
      tags: [Statistics]
      summary: Consulter les statistiques du tableau de bord
      description: Les statistiques sont globales pour un administrateur et limitees a l'institution du bibliothecaire.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistiques disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "401":
          description: Jeton JWT absent ou invalide
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: UP }
        service: { type: string, example: metamind-backend }
        timestamp: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: sarah@institution-a.example }
        password: { type: string, format: password, example: "558435" }
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, institution, password]
      properties:
        firstName: { type: string, example: Sarah }
        lastName: { type: string, example: Lemaire }
        email: { type: string, format: email, example: sarah@institution-a.example }
        institution: { type: string, example: Institution A }
        password: { type: string, format: password, example: "558435" }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: Bibliothecaire }
        institution: { type: string, example: Institution A }
        status: { type: string, enum: [ACTIF, DESACTIVE] }
    UpdateProfileRequest:
      type: object
      required: [firstName, lastName, institution]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        institution: { type: string }
    Publication:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        institution: { type: string }
        year: { type: integer }
        status: { type: string, enum: [EN_ATTENTE, EXTRACTION, A_VALIDER, PUBLIE, SUPPRIME] }
        visibility: { type: string, enum: [PUBLIC, INSTITUTION] }
        keywords:
          type: array
          items:
            type: string
    CreatePublicationRequest:
      type: object
      required: [title, author, year, visibility, keywords]
      properties:
        title: { type: string, maxLength: 220, example: Analyse automatique des metadonnees }
        author: { type: string, maxLength: 160, example: Sarah Lemaire }
        year: { type: integer, minimum: 1900, maximum: 2100, example: 2026 }
        visibility: { type: string, enum: [PUBLIC, INSTITUTION] }
        keywords:
          type: array
          maxItems: 20
          items:
            type: string
    PublicationStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [A_VALIDER, PUBLIE, SUPPRIME], example: PUBLIE }
    Institution:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: INST-A }
        name: { type: string, example: Institution A }
        emailDomain: { type: string, example: institution-a.example }
        active: { type: boolean }
    CreateInstitutionRequest:
      type: object
      required: [code, name, emailDomain]
      properties:
        code: { type: string, example: INST-A }
        name: { type: string, example: Institution A }
        emailDomain: { type: string, example: institution-a.example }
    CreditBalance:
      type: object
      properties:
        institutionId: { type: integer, format: int64 }
        institution: { type: string, example: Institution A }
        balance: { type: integer, example: 12 }
    CreditMovement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        institution: { type: string, example: Institution A }
        type: { type: string, enum: [ACHAT, CONSOMMATION], example: ACHAT }
        amount: { type: integer, example: 10 }
        balanceAfter: { type: integer, example: 30 }
        description: { type: string, example: Achat de credits }
        createdAt: { type: string, format: date-time }
    CreditPurchaseRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, example: 20 }
    MetadataExtraction:
      type: object
      properties:
        publicationId: { type: integer, format: int64 }
        title: { type: string }
        suggestedTitle: { type: string }
        suggestedAuthor: { type: string }
        suggestedKeywords:
          type: array
          items:
            type: string
        creditBalance: { type: integer }
    Statistics:
      type: object
      properties:
        scope: { type: string, example: Institution A }
        totalPublications: { type: integer, example: 120 }
        publishedPublications: { type: integer, example: 90 }
        pendingValidationPublications: { type: integer, example: 12 }
        publicPublications: { type: integer, example: 80 }
        institutionOnlyPublications: { type: integer, example: 40 }
        creditBalance: { type: integer, example: 25 }
