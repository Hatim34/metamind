<article class="publication-card">
  <div class="pub-main">
    <div class="pub-cover" aria-hidden="true">
      <img *ngIf="publication.imageUrl" [src]="publication.imageUrl" alt="" />
      <svg *ngIf="!publication.imageUrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" /></svg>
    </div>
    <div class="pub-text">
      <h3>{{ publication.title }}</h3>
      <p>{{ publication.author }} · {{ publication.institution }} · {{ publication.publicationDate || publication.year }}</p>
      <p class="pub-summary" *ngIf="publication.summary">{{ publication.summary }}</p>
    </div>
  </div>
  <div class="tags">
    <span class="badge" [class.badge-green]="publication.status === 'PUBLIE'" [class.badge-amber]="publication.status === 'A_VALIDER' || publication.status === 'EXTRACTION'" [class.badge-red]="publication.status === 'SUPPRIME'">{{ publication.status === 'EXTRACTION' ? labels.processing : publication.status }}</span>
    <span>{{ publication.visibility }}</span>
    <span *ngFor="let keyword of publication.keywords">{{ keyword }}</span>
  </div>
  <div class="publication-actions">
    <button type="button" (click)="consult.emit(publication)">{{ labels.consult }}</button>
    <button type="button" class="primary" *ngIf="allowExtract" (click)="extract.emit(publication)">{{ labels.extract }}</button>
    <button type="button" *ngIf="allowEdit" (click)="edit.emit(publication)">{{ labels.edit }}</button>
    <button type="button" class="danger" *ngIf="allowDelete" (click)="remove.emit(publication)">{{ labels.delete }}</button>
  </div>
  <ng-content></ng-content>
</article>
