<article class="publication-card">
  <div class="doc-main">
    <img *ngIf="coverUrl; else typedCover" class="doc-cover-image" [src]="coverUrl" alt="" />
    <ng-template #typedCover><span class="doc-cover" [ngClass]="coverClass" aria-hidden="true"><span>{{ documentType }}</span><small>{{ publicationYear }}</small></span></ng-template>
    <button type="button" class="doc-text" (click)="consult.emit(publication)">
      <span class="doc-meta">{{ documentType }}<ng-container *ngIf="publicationYear"> · {{ publicationYear }}</ng-container><ng-container *ngIf="publication.institution"> · {{ publication.institution }}</ng-container></span>
      <h3>{{ publication.title }}</h3>
      <span class="doc-author" *ngIf="publication.author">{{ publication.author }}</span>
      <span class="doc-summary" *ngIf="publication.summary">{{ publication.summary }}</span>
      <span class="doc-details"><span *ngIf="publication.language">{{ publication.language }}</span><span *ngIf="publication.fileUrl">PDF</span></span>
    </button>
  </div>

  <ol class="doc-pipeline" *ngIf="showWorkflow && publication.status !== 'SUPPRIME'" aria-hidden="true">
    <li *ngFor="let step of steps" [class]="'pipe-' + step.state">
      <span class="pipe-dot"></span>
      <span class="pipe-label">{{ step.label }}</span>
    </li>
  </ol>

  <div class="tags" *ngIf="publication.keywords.length > 0"><span *ngFor="let keyword of publication.keywords">{{ keyword }}</span></div>

  <div class="publication-actions" *ngIf="(allowRetry || allowExtract || allowEdit || allowDelete) && !confirmingDelete">
    <button type="button" *ngIf="allowRetry" (click)="retry.emit(publication)">{{ labels.retry }}</button>
    <button type="button" class="primary" *ngIf="allowExtract && !isEnriched" (click)="extract.emit(publication)">{{ labels.extract }}</button>
    <button type="button" class="primary" *ngIf="allowEdit && isEnriched" (click)="edit.emit(publication)">{{ labels.edit }}</button>
    <button type="button" *ngIf="allowExtract && isEnriched" (click)="extract.emit(publication)">{{ labels.extract }}</button>
    <button type="button" class="danger" *ngIf="allowDelete" (click)="askDelete()">{{ labels.delete }}</button>
  </div>

  <div class="publication-actions delete-confirm" *ngIf="confirmingDelete">
    <span class="confirm-text">{{ labels.confirmDelete }}</span>
    <button type="button" class="danger" (click)="confirmDelete()">{{ labels.confirm }}</button>
    <button type="button" (click)="cancelDelete()">{{ labels.cancel }}</button>
  </div>

  <ng-content></ng-content>
</article>
