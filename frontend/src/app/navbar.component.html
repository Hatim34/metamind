<nav class="navbar">
  <div class="navbar-inner">
    <button type="button" class="nav-brand" (click)="navigate('accueil')" [attr.aria-label]="labels.title">
      <span class="nav-logo" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 42 42" role="img" aria-label="Metamind">
          <rect x="3" y="3" width="36" height="36" rx="8" fill="#12787B" />
          <circle cx="14" cy="15" r="3" fill="#fff" />
          <circle cx="28" cy="13" r="3" fill="#fff" />
          <circle cx="21" cy="28" r="3" fill="#fff" />
          <path d="M14,15 L28,13 M14,15 L21,28 M28,13 L21,28" stroke="#fff" stroke-width="1.6" fill="none" opacity="0.85" />
        </svg>
      </span>
      <span class="nav-word">Metamind</span>
    </button>
    <div class="nav-links" role="navigation" aria-label="Navigation principale">
      <!-- Zone publique : accessible sans compte. -->
      <div class="nav-group" [attr.aria-label]="labels.publicZone">
        <button type="button" [class.active]="isCurrent('accueil')" (click)="navigate('accueil')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5" /><path d="M5.5 9.5V20h13V9.5" /></svg>
          <span>{{ labels.home }}</span>
        </button>
        <button type="button" [class.active]="isCurrent('catalogue')" (click)="navigate('catalogue')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
          <span>{{ labels.catalogue }}</span>
        </button>
      </div>

      <!-- Zone de travail : reservee aux comptes connectes. -->
      <div class="nav-group nav-group-workspace" *ngIf="authenticated" [attr.aria-label]="labels.workspaceZone">
        <span class="nav-group-label" aria-hidden="true">{{ labels.workspaceZone }}</span>
        <button type="button" [class.active]="isCurrent('publication')" (click)="navigate('publication')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4" /><path d="m7.5 8.5 4.5-4.5 4.5 4.5" /><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" /></svg>
          <span>{{ labels.newPublication }}</span>
        </button>
        <button type="button" [class.active]="isCurrent('validation')" (click)="navigate('validation')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" /><path d="m17 17 2 2 4-4" /></svg>
          <span>{{ labels.validationQueue }}</span>
        </button>
        <button type="button" [class.active]="isCurrent('credits')" (click)="navigate('credits')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M15 9.5c-.4-.7-1.3-1.1-2.6-1.1-1.5 0-2.5.6-2.5 1.7 0 2.7 5.3 1.1 5.3 4 0 1.1-1 1.8-2.7 1.8-1.4 0-2.5-.5-2.9-1.3M12.5 6.7v10.6" /></svg>
          <span>{{ labels.credits }}</span>
        </button>
        <button type="button" *ngIf="administrator" [class.active]="isCurrent('administration')" (click)="navigate('administration')">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18" /><path d="M7 14l4-4 3 3 5-6" /></svg>
          <span>{{ labels.administration }}</span>
        </button>
      </div>
    </div>
    <div class="nav-actions">
      <div class="language-switch" [attr.aria-label]="labels.language">
        <button type="button" [class.active]="language === 'fr'" (click)="changeLanguage('fr')">FR</button>
        <button type="button" [class.active]="language === 'nl'" (click)="changeLanguage('nl')">NL</button>
        <button type="button" [class.active]="language === 'en'" (click)="changeLanguage('en')">EN</button>
      </div>
      <button type="button" class="nav-login" *ngIf="!authenticated" [class.active]="page === 'connexion'" (click)="navigate('connexion')">{{ labels.login }}</button>
      <div class="nav-account" *ngIf="authenticated">
        <button type="button" class="nav-user" (click)="navigate('profil')" [title]="userName">
          <span class="nav-account-copy">
            <span class="nav-institution">{{ institutionName || userName }}</span>
            <span class="nav-user-name">{{ userName }}</span>
          </span>
          <span class="nav-avatar" aria-hidden="true">{{ initials }}</span>
        </button>
        <button type="button" class="nav-signout" (click)="signOut.emit()">{{ labels.signOut }}</button>
      </div>
    </div>
  </div>
</nav>
