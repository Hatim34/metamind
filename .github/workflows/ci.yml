name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      - name: Installation de Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests backend
        run: mvn test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Installation des dependances
        run: npm install

      - name: Tests frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        run: npm run build -- --progress=false

  deploiement:
    name: Deploiement
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      - name: Validation Docker Compose
        run: docker compose --env-file .env.example config
