services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamind}
      POSTGRES_USER: ${POSTGRES_USER:-metamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamind} -d ${POSTGRES_DB:-metamind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      METAMIND_DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-metamind}
      METAMIND_DATABASE_USERNAME: ${POSTGRES_USER:-metamind}
      METAMIND_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      METAMIND_JPA_DDL_AUTO: update
      METAMIND_H2_CONSOLE: "false"
      METAMIND_SEED_DATA: "true"
      METAMIND_JWT_SECRET: ${METAMIND_JWT_SECRET:?METAMIND_JWT_SECRET is required}
      METAMIND_PUBLIC_URL: https://${METAMIND_DOMAIN:-metamind-app.duckdns.org}
      METAMIND_LLM_PROVIDER: ${METAMIND_LLM_PROVIDER:-local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      METAMIND_DOMAIN: ${METAMIND_DOMAIN:-metamind-app.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
