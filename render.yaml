databases:
  - name: metamind-db
    plan: free
    databaseName: metamind
    user: metamind

services:
  - type: web
    name: metamind
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: METAMIND_DATABASE_URL
        fromDatabase:
          name: metamind-db
          property: connectionString
      - key: METAMIND_DATABASE_USERNAME
        fromDatabase:
          name: metamind-db
          property: user
      - key: METAMIND_DATABASE_PASSWORD
        fromDatabase:
          name: metamind-db
          property: password
      - key: METAMIND_JPA_DDL_AUTO
        value: update
      - key: METAMIND_H2_CONSOLE
        value: "false"
      - key: METAMIND_SEED_DATA
        value: "true"
      - key: METAMIND_JWT_SECRET
        generateValue: true
      - key: METAMIND_LLM_PROVIDER
        value: local
      - key: METAMIND_PUBLIC_URL
        fromService:
          type: web
          name: metamind
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
